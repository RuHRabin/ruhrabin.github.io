name: Sync data and build site

# Runs (1) every 3 hours to refresh the GitHub data and rebuild everything that is rendered from it
# (project list, JSON-LD, sitemap, llms.txt), (2) when you change the sources, and (3) on demand.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/scripts/**'

permissions:
  contents: write

concurrency:
  group: sync-and-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: RuHRabin
        run: node .github/scripts/sync-github-data.mjs

      - name: Install build dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # If the build output is not valid (broken links, bad JSON-LD, missing tags) nothing is published.
      - name: Validate the build
        run: npm test

      - name: Commit data and built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data index.html 404.html projects assets sitemap.xml robots.txt llms.txt _config.yml
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: sync GitHub data and rebuild site [skip ci]"
          # Someone may have pushed while this job ran; rebase and retry instead of failing.
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
