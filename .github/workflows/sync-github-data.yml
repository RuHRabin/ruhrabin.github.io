name: Sync GitHub data

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/github-sync.json'

permissions:
  contents: write

concurrency:
  group: sync-github-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: RuHRabin
        run: node .github/scripts/sync-github-data.mjs

      - name: Commit updated data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/github-sync.json
          git diff --cached --quiet || git commit -m "chore: sync GitHub data [skip ci]"
          git push
